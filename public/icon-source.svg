<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep indigo radial bg — like option 1/2/3 -->
    <radialGradient id="bgr" cx="50%" cy="44%" r="58%">
      <stop offset="0%"   stop-color="#2e1f88"/>
      <stop offset="60%"  stop-color="#0d0926"/>
      <stop offset="100%" stop-color="#050412"/>
    </radialGradient>

    <!-- TV body gradient (subtle top-to-bottom shine) -->
    <linearGradient id="tvg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c1f70"/>
      <stop offset="100%" stop-color="#160e44"/>
    </linearGradient>

    <!-- Soft spotlight glow behind person inside the screen -->
    <radialGradient id="spot" cx="50%" cy="50%" r="44%">
      <stop offset="0%"   stop-color="#5b52f0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5b52f0" stop-opacity="0"/>
    </radialGradient>

    <!-- Person silhouette glow -->
    <filter id="pg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" fill="url(#bgr)"/>

  <!-- ── TV antennae ── -->
  <line x1="392" y1="264" x2="348" y2="152"
        stroke="#6366f1" stroke-width="22" stroke-linecap="round"/>
  <line x1="632" y1="264" x2="676" y2="152"
        stroke="#6366f1" stroke-width="22" stroke-linecap="round"/>

  <!-- ── TV body ── -->
  <rect x="170" y="264" width="684" height="530" rx="44"
        fill="url(#tvg)" stroke="#5b52f0" stroke-width="10"/>

  <!-- ── TV screen (inner panel) ── -->
  <rect x="214" y="310" width="596" height="376" rx="18" fill="#040314"/>
  <!-- Spotlight glow over screen -->
  <rect x="214" y="310" width="596" height="376" rx="18" fill="url(#spot)"/>

  <!-- ── Person silhouette ── -->
  <!-- Head -->
  <circle cx="512" cy="400" r="72" fill="#c7d2fe" filter="url(#pg)"/>
  <!-- Bust: neckline at y≈472, shoulders at y≈580, fills to screen bottom y≈682 -->
  <path d="M 372,582 Q 372,480 512,462 Q 652,480 652,582 L 652,682 L 372,682 Z"
        fill="#c7d2fe" filter="url(#pg)"/>

  <!-- ── Focus brackets (inspired by option 2 + 6) ── -->
  <!-- Screen: x=214..810, y=310..686; brackets inset 14px, arm=58px, thickness=22 -->
  <!-- TL -->
  <rect x="228" y="324" width="58" height="22" rx="5" fill="#a5b4fc"/>
  <rect x="228" y="324" width="22" height="58" rx="5" fill="#a5b4fc"/>
  <!-- TR (outer right edge x=794) -->
  <rect x="736" y="324" width="58" height="22" rx="5" fill="#a5b4fc"/>
  <rect x="772" y="324" width="22" height="58" rx="5" fill="#a5b4fc"/>
  <!-- BL (outer bottom edge y=672) -->
  <rect x="228" y="650" width="58" height="22" rx="5" fill="#a5b4fc"/>
  <rect x="228" y="614" width="22" height="58" rx="5" fill="#a5b4fc"/>
  <!-- BR -->
  <rect x="736" y="650" width="58" height="22" rx="5" fill="#a5b4fc"/>
  <rect x="772" y="614" width="22" height="58" rx="5" fill="#a5b4fc"/>

  <!-- ── TV feet ── -->
  <rect x="358" y="794" width="96" height="42" rx="12"
        fill="url(#tvg)" stroke="#5b52f0" stroke-width="8"/>
  <rect x="570" y="794" width="96" height="42" rx="12"
        fill="url(#tvg)" stroke="#5b52f0" stroke-width="8"/>
</svg>
